# yaml-language-server: $schema=../config.schema.json

pidfile: "%PIDFILE%"
graceful_shutdown_timeout: 60s

http:
  apps:
    - listen:
        - addr: 25543
          ssl:
            cert: cert/self-signed-cert.pem
            key: cert/self-signed-key.pem
      return:
        status: 200
        response_headers:
          - [ x-version, "%VERSION%" ]
